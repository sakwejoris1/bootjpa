<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Alien</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <p class="eyebrow">ALIEN DIRECTORY</p>
            <h1>Edit alien</h1>
            <p>Update the details, then save your changes.</p>
        </div>
    </header>

    <main class="container page-content">
        <section class="card form-card">
            <form th:action="${formAction}" th:object="${alien}" method="post" class="alien-form">
                <input type="hidden" th:field="*{aid}">
                <div class="field">
                    <label for="aid-display">Alien ID</label>
                    <input type="number" id="aid-display" th:value="*{aid}" readonly>
                    <span class="field-error" th:if="${#fields.hasErrors('aid')}" th:errors="*{aid}"></span>
                </div>
                <div class="field">
                    <label for="aname">Alien name</label>
                    <input type="text" id="aname" th:field="*{aname}" maxlength="255" required>
                    <span class="field-error" th:if="${#fields.hasErrors('aname')}" th:errors="*{aname}"></span>
                </div>
                <div class="field">
                    <label for="tech">Technology</label>
                    <input type="text" id="tech" th:field="*{tech}" maxlength="255" required>
                    <span class="field-error" th:if="${#fields.hasErrors('tech')}" th:errors="*{tech}"></span>
                </div>
                <div class="form-actions">
                    <button type="submit">Save changes</button>
                    <a class="button button-secondary" th:href="@{/}">Cancel</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
