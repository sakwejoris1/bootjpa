spring.application.name=bootjpa
server.port=${PORT:8082}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/bootjpa}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bootjpa}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bootjpa}
spring.jpa.hibernate.ddl-auto=update
